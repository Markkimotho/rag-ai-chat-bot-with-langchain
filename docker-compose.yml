services:
  ollama:
    image: ollama/ollama:latest
    container_name: exam-prep-ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama ps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    container_name: exam-prep-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command: >
      -c "
        echo 'Pulling qwen2.5:7b (~4.7 GB)...' &&
        ollama pull qwen2.5:7b &&
        echo 'Pulling nomic-embed-text (~274 MB)...' &&
        ollama pull nomic-embed-text &&
        echo 'All models ready.'
      "
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam-prep-web
    ports:
      - "8000:8000"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data/pdfs:/app/data/pdfs
      - chroma_data:/app/data/chroma
    restart: unless-stopped

volumes:
  ollama_models:
  chroma_data:

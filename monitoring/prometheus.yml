global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Prep Pal AI FastAPI backend. Reachable as `web:8000` when this stack is
  # launched in the same Compose project (see docker-compose.monitoring.yml).
  - job_name: preppal-web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8000"]
        labels:
          service: preppal-web
